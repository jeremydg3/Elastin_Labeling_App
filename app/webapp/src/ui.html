<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #47545b;
  color: white;
}
.top-panel {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 10px;
}
button {
  padding: 12px 20px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
  background: #c7c7c7;
  cursor: pointer;
}
button:hover { background: #dedede; }

.color-panel {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px;
  justify-content: center;
  background: #3a464c;
}
.color-btn, .eraser-btn {
  width: 100px;
  padding: 8px;
  border-radius: 6px;
  text-align: center;
  cursor: pointer;
  border: 2px solid transparent;
}
.color-btn.active, .eraser-btn.active {
  border: 3px solid #fff;
}
.paint-area-wrapper {
  display: flex;
  justify-content: center;
  margin-top: 10px;
  position: relative;
}
#imgCanvas, #maskCanvas {
  position: absolute;
  top: 0; left: 0;
  touch-action: none;
}
.brush-controls {
  position: absolute;
  right: 10px;
  top: 10px;
  font-size: 20px;
}
.brush-btn {
  display: block;
  margin-bottom: 5px;
  background: #222;
  padding: 5px;
  border-radius: 4px;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="top-panel">
  <button onclick="markDone()">Mark Done</button>
  <button onclick="skipImage()">Skip Image</button>
</div>

<div class="color-panel" id="colorPanel"></div>

<div class="paint-area-wrapper">
  <canvas id="imgCanvas"></canvas>
  <canvas id="maskCanvas"></canvas>

  <div class="brush-controls">
    <div class="brush-btn" onclick="changeBrushSize(2)">+</div>
    <div class="brush-btn" onclick="changeBrushSize(-2)">-</div>
  </div>
</div>

<script>
/*********** CONFIG ***********/
const colors = [
  "#167288","#8cdaec","#b45248","#d48c84","#a89a49",
  "#d6cfa2","#3cb464","#9bddb1","#643c6a","#836394"
];
const ERASER = 255;
let activeGroup = 0;
let brushSize = 12;

/*********** Canvas ***********/
const imgCanvas = document.getElementById("imgCanvas");
const maskCanvas = document.getElementById("maskCanvas");
const imgCtx = imgCanvas.getContext("2d");
const maskCtx = maskCanvas.getContext("2d");
let img = new Image();
let mask = [];
let scale = 1, offsetX = 0, offsetY = 0;
let isPainting = false;

async function post(action, payload={}) {
  const res = await fetch('', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ action, ...payload })
  });
  return res.json();
}

/*********** UI BUILD: Color Buttons ***********/
function buildColorButtons(){
  const panel = document.getElementById("colorPanel");
  panel.innerHTML = "";
  
  colors.forEach((c,i)=>{
    let btn = document.createElement("div");
    btn.className = "color-btn";
    btn.style.background = c;
    btn.textContent = "Group " + i;
    btn.onclick = ()=>setActiveGroup(i);
    panel.appendChild(btn);
  });

  let er = document.createElement("div");
  er.className = "eraser-btn";
  er.textContent = "Eraser";
  er.style.background = "#e9824f";
  er.onclick = ()=>setActiveGroup(ERASER);
  panel.appendChild(er);

  updateActiveHighlight();
}
function updateActiveHighlight(){
  document.querySelectorAll(".color-btn").forEach((b,i)=>{
    b.classList.toggle("active", i===activeGroup);
  });
  document.querySelector(".eraser-btn")
    .classList.toggle("active", activeGroup === ERASER);
}
function setActiveGroup(g){ activeGroup = g; updateActiveHighlight(); }

/*********** Brush control ***********/
function changeBrushSize(delta){
  brushSize = Math.max(2, brushSize + delta);
}

/*********** Zoom ***********/
function zoomAtPoint(delta, x, y){
  let previousScale = scale;
  scale = Math.min(8, Math.max(0.5, scale + delta));
  offsetX = x - (x - offsetX) * (scale/previousScale);
  offsetY = y - (y - offsetY) * (scale/previousScale);
  draw();
}
imgCanvas.addEventListener("wheel", e=>{
  e.preventDefault();
  zoomAtPoint(e.deltaY < 0 ? 0.1 : -0.1, e.offsetX, e.offsetY);
});

/*********** Touch Zoom ***********/
let lastDist = 0;
maskCanvas.addEventListener("touchmove", e=>{
  if(e.touches.length===2){
    e.preventDefault();
    let dx = e.touches[0].clientX - e.touches[1].clientX;
    let dy = e.touches[0].clientY - e.touches[1].clientY;
    let d = Math.sqrt(dx*dx+dy*dy);
    if(lastDist) zoomAtPoint((d-lastDist)/200, e.touches[0].clientX, e.touches[0].clientY);
    lastDist = d;
  }
});
maskCanvas.addEventListener("touchend", ()=>lastDist=0);

/*********** Painting ***********/
function canvasToImageCoords(x, y){
  return {
    ix: Math.floor((x - offsetX) / scale),
    iy: Math.floor((y - offsetY) / scale)
  };
}
function paint(x,y){
  let {ix,iy} = canvasToImageCoords(x,y);
  for(let i=-brushSize;i<=brushSize;i++){
    for(let j=-brushSize;j<=brushSize;j++){
      if(i*i+j*j <= brushSize*brushSize){
        let nx = ix + i, ny = iy + j;
        if(nx>=0 && ny>=0 && nx<img.width && ny<img.height){
          mask[ny][nx] = (activeGroup===ERASER?255:activeGroup);
        }
      }
    }
  }
  draw();
}
maskCanvas.addEventListener("mousedown", e=>{
  isPainting = true; paint(e.offsetX,e.offsetY);
});
maskCanvas.addEventListener("mousemove", e=>{
  if(isPainting) paint(e.offsetX,e.offsetY);
});
window.addEventListener("mouseup", ()=>isPainting=false);

/*********** Draw ***********/
function draw(){
  imgCtx.setTransform(scale,0,0,scale,offsetX,offsetY);
  maskCtx.setTransform(scale,0,0,scale,offsetX,offsetY);

  imgCtx.clearRect(0,0,imgCanvas.width,imgCanvas.height);
  imgCtx.drawImage(img,0,0);

  maskCtx.clearRect(0,0,maskCanvas.width,maskCanvas.height);
  let imgData = maskCtx.getImageData(0,0,img.width,img.height);
  for(let y=0;y<img.height;y++){
    for(let x=0;x<img.width;x++){
      let v = mask[y][x];
      if(v!==255){
        let color = colors[v];
        let idx = (y*img.width+x)*4;
        let rgb = hexToRgb(color);
        imgData.data[idx]   = rgb.r;
        imgData.data[idx+1] = rgb.g;
        imgData.data[idx+2] = rgb.b;
        imgData.data[idx+3] = 150;
      }
    }
  }
  maskCtx.putImageData(imgData,0,0);
}
function hexToRgb(h){
  let bigint = parseInt(h.slice(1),16);
  return {r:(bigint>>16)&255, g:(bigint>>8)&255, b:bigint&255};
}

/*********** Load Image & Mask ***********/
function loadNewImage(dataUrl){
  activeGroup = 0;
  updateActiveHighlight();
  img.src = dataUrl;
  img.onload = ()=>{
    imgCanvas.width = img.height;
    imgCanvas.height = img.width;
    maskCanvas.width = img.width;
    maskCanvas.height = img.height;

    mask = Array.from({length:img.height},()=>Array(img.width).fill(255));
    scale = 1; offsetX = offsetY = 0;
    draw();
  }
}

/*********** Server Actions ***********/
function markDone(){
  try {
    post('done', { fileId: currentFileId, mask });
  } catch (e) {
    console.error('Error marking image as done:', e);
  }
  // google.script.run.withSuccessHandler(loadNewImage)
  //   .saveMaskAndGetNext(mask);
}
function skipImage(){
  try {
    post('skip', { fileId: currentFileId });
  } catch (e) {
    console.error('Error skipping image:', e);
  }
  // google.script.run.withSuccessHandler(loadNewImage)
  //   .skipAndGetNext();
}
function getNextImage(){
  try {
    post('next');
  } catch (e) {
    console.error('Error getting next image:', e);
  }
}

/*********** Hotkeys ***********/
window.addEventListener("keydown", e=>{
  if(!isNaN(e.key)) setActiveGroup(Number(e.key));
  if(e.key==="e") setActiveGroup(ERASER);
  if(e.key==="+") changeBrushSize(2);
  if(e.key==="-") changeBrushSize(-2);
});

/*********** Init ***********/
buildColorButtons();
google.script.run.withSuccessHandler(loadNewImage).getNextImage();

</script>
</body>
</html>
